<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scaffold Safety Final Exam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        
        /* Optimization for Google Sites Iframe Embedding */
        html, body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 0;
            background-color: transparent; /* Blends with Google Site */
            overflow-x: hidden; /* Prevents horizontal scroll */
        }
        
        .loader { border-top-color: #4f46e5; -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* ID Card Styles */
        .id-card-container {
            width: 320px;
            height: 480px; 
            background: white;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            position: relative;
            box-sizing: border-box;
        }
        .signature-font { font-family: 'Great Vibes', cursive; }
    </style>
</head>
<body class="text-slate-900 antialiased">

    <div id="app-content" class="w-full flex flex-col items-center py-6"></div>

    <!-- Equipment Detail Modal -->
    <div id="item-modal" class="fixed inset-0 bg-black/90 z-[60] hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity" onclick="closeItem()"></div>

    <script>
        // --- CONFIGURATION ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbznmoh_Q0JQEFvbgXvbxYqOWjQjiCE5tg8BJgIcukDWEvmX9CrzH80wBB7xxzmOPczcHQ/exec"; 

        // --- GLOBAL STATE ---
        let state = {
            view: 'home',
            questions: [],
            equipment: [],
            loading: false,
            
            examUser: { name: '', mobile: '', aadhaar: '', photo: null, trainingId: '' },
            examQuestions: [],
            examCurrentIdx: 0,
            examScore: 0,
            examHistory: [], 
            examAnswerRevealed: false,
            
            // Training State
            trainingTab: 'qa', // 'qa' or 'equip'
            selectedItem: null,
            selectedItemIndex: -1
        };

        // --- CORE FUNCTIONS ---
        function processImageUrl(url) {
            if (!url) return null;
            if (url.includes('drive.google.com') || url.includes('docs.google.com')) {
                const idMatch = url.match(/\/d\/([^/]+)/);
                if (idMatch && idMatch[1]) return `https://lh3.googleusercontent.com/d/${idMatch[1]}`;
            }
            return url;
        }

        async function fetchSheetData() {
            if (!SCRIPT_URL) return;
            state.loading = true;
            render(); 
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                if (data.questions?.length > 0) state.questions = data.questions;
                if (data.equipment?.length > 0) state.equipment = data.equipment;
            } catch (error) { console.error("Data error", error); } 
            finally { state.loading = false; render(); }
        }

        // --- EXAM LOGIC ---
        function startExamRegistration() {
            if (state.questions.length === 0) {
                alert("Please wait for data to load completely.");
                return;
            }
            state.view = 'exam-register';
            render();
        }

        function handleRegistration() {
            const name = document.getElementById('regName').value.trim();
            const mobile = document.getElementById('regMobile').value.trim();
            if (!name || !mobile) { alert("Please provide your Name and Mobile Number."); return; }
            state.examUser = { name, mobile, aadhaar: '', photo: null, trainingId: '' };
            
            try {
                fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        name: name,
                        mobile: mobile,
                        aadhaar: "PENDING",
                        trainingId: "PENDING",
                        percentage: 0,
                        status: "STARTED"
                    })
                }).catch(e => console.error("Failed to log start entry", e));
            } catch(e) {}

            state.view = 'exam-instructions';
            render();
        }

        function startAssessmentAfterInstructions() {
            generateExamQuestions();
        }

        function generateExamQuestions() {
            const textPool = [...state.questions].sort(() => 0.5 - Math.random());
            const textQs = textPool.slice(0, 25).map(q => {
                let opts = q.options && q.options.length > 0 ? q.options : [q.a];
                return {
                    type: 'text',
                    question: q.q,
                    correct: q.a,
                    options: [...opts].sort(() => 0.5 - Math.random()) 
                };
            });

            let imgQs = [];
            if (state.equipment.length >= 5) {
                const imgPool = [...state.equipment].sort(() => 0.5 - Math.random());
                imgQs = imgPool.slice(0, 5).map(eq => {
                    const others = state.equipment.filter(x => x.id !== eq.id).map(x => x.name);
                    const wrong = others.sort(() => 0.5 - Math.random()).slice(0, 2);
                    return {
                        type: 'image',
                        image: eq.image,
                        question: "Identify this equipment:",
                        correct: eq.name,
                        options: [eq.name, ...wrong].sort(() => 0.5 - Math.random())
                    };
                });
            }

            state.examQuestions = [...textQs, ...imgQs].sort(() => 0.5 - Math.random());
            state.examCurrentIdx = 0;
            state.examScore = 0;
            state.examHistory = [];
            state.examAnswerRevealed = false;
            state.view = 'exam-active';
            render();
        }

        function submitExamAnswer(selectedOption) {
            if (state.examAnswerRevealed) return; 

            const q = state.examQuestions[state.examCurrentIdx];
            const isCorrect = (selectedOption === q.correct);
            
            if (isCorrect) state.examScore++;
            
            state.examHistory.push({
                question: q.question,
                type: q.type,
                userAnswer: selectedOption,
                correctAnswer: q.correct,
                isCorrect: isCorrect
            });

            state.examAnswerRevealed = true;
            render();
        }

        function nextQuestion() {
            if (state.examCurrentIdx + 1 < state.examQuestions.length) {
                state.examCurrentIdx++;
                state.examAnswerRevealed = false;
                render();
            } else {
                checkExamResult();
            }
        }

        function checkExamResult() {
            const total = state.examQuestions.length;
            const percentage = Math.round((state.examScore / total) * 100);
            const passed = percentage >= 80; 

            if (passed) {
                state.view = 'exam-pass-details';
                render();
            } else {
                saveFailedResult(percentage);
            }
        }

        function handlePhotoUpload(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    state.examUser.photo = e.target.result;
                    document.getElementById('photo-preview').src = e.target.result;
                    document.getElementById('photo-preview').classList.remove('hidden');
                    document.getElementById('photo-placeholder').classList.add('hidden');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function generateIDCardAndSave() {
            const aadhaar = document.getElementById('aadhaarInput').value.trim();
            if (!state.examUser.photo || !aadhaar) {
                alert("Please upload a photo and enter your Aadhaar number.");
                return;
            }
            
            state.loading = true;
            state.examUser.aadhaar = aadhaar;
            render(); 

            const trainingId = `TR-${new Date().getFullYear()}-${Math.floor(1000 + Math.random() * 9000)}`;
            state.examUser.trainingId = trainingId;

            const total = state.examQuestions.length;
            const percentage = Math.round((state.examScore / total) * 100);

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        name: state.examUser.name,
                        mobile: state.examUser.mobile,
                        aadhaar: aadhaar,
                        trainingId: trainingId,
                        percentage: percentage,
                        status: "PASS"
                    })
                });
            } catch (e) { console.error("Save failed", e); }

            state.loading = false;
            state.view = 'exam-id-card';
            render();

            setTimeout(() => {
                downloadIDCard();
                setTimeout(() => downloadReportCardPDF(), 1500); 
            }, 500);
        }

        async function saveFailedResult(percentage) {
            state.loading = true;
            render();
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        name: state.examUser.name,
                        mobile: state.examUser.mobile,
                        aadhaar: "N/A",
                        trainingId: "N/A",
                        percentage: percentage,
                        status: "FAIL"
                    })
                });
            } catch (e) { console.error("Save failed", e); }
            
            state.loading = false;
            state.view = 'exam-fail';
            render();

            setTimeout(() => downloadReportCardPDF(), 500);
        }

        // --- EQUIPMENT MODAL FUNCTIONS ---
        function viewItem(id) { 
            const index = state.equipment.findIndex(e => e.id == id); 
            if (index !== -1) { 
                state.selectedItemIndex = index; 
                state.selectedItem = state.equipment[index]; 
                renderModal(); 
            } 
        }
        function closeItem() { 
            state.selectedItem = null; 
            state.selectedItemIndex = -1; 
            document.getElementById('item-modal').classList.add('hidden'); 
        }
        function navItem(direction) { 
            if(event) event.stopPropagation(); 
            let newIndex = state.selectedItemIndex + direction; 
            if (newIndex < 0) newIndex = state.equipment.length - 1; 
            if (newIndex >= state.equipment.length) newIndex = 0; 
            state.selectedItemIndex = newIndex; 
            state.selectedItem = state.equipment[newIndex]; 
            renderModal(); 
        }
        
        function renderModal() {
            const modal = document.getElementById('item-modal');
            const item = state.selectedItem;
            if (!item) return;
            const imgUrl = processImageUrl(item.image);
            modal.innerHTML = `
                <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl relative flex flex-col content-enter border border-slate-200" onclick="event.stopPropagation()">
                    <button onclick="closeItem()" class="absolute top-3 right-3 bg-white/80 border border-slate-200 text-slate-800 p-2 rounded-full hover:bg-white z-20 shadow-sm"><i data-lucide="x" style="width:20px;height:20px;"></i></button>
                    <div class="relative h-56 shrink-0 bg-slate-50 w-full rounded-t-2xl overflow-hidden group">
                        ${imgUrl ? `<img src="${imgUrl}" alt="${item.name}" class="w-full h-full object-contain p-4"/>` : `<div class="w-full h-full flex items-center justify-center text-slate-400"><i data-lucide="image" style="width:48px;height:48px;"></i></div>`}
                        <div class="absolute inset-0 flex items-center justify-between px-2">
                            <button onclick="navItem(-1)" class="bg-white/90 hover:bg-white text-slate-800 p-2 rounded-full shadow-sm border border-slate-200 transition-transform active:scale-90"><i data-lucide="chevron-left" style="width:24px;height:24px;"></i></button>
                            <button onclick="navItem(1)" class="bg-white/90 hover:bg-white text-slate-800 p-2 rounded-full shadow-sm border border-slate-200 transition-transform active:scale-90"><i data-lucide="chevron-right" style="width:24px;height:24px;"></i></button>
                        </div>
                    </div>
                    <div class="p-6">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-bold text-slate-400 uppercase">Item ${state.selectedItemIndex + 1} of ${state.equipment.length}</span>
                        </div>
                        <h3 class="text-xl font-bold text-slate-800 mb-3">${item.name}</h3>
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 text-slate-600 text-sm leading-relaxed max-h-40 overflow-y-auto">
                            ${item.detail || "No details available."}
                        </div>
                    </div>
                </div>`;
            modal.classList.remove('hidden');
            lucide.createIcons();
        }

        // --- DOWNLOAD FUNCTIONS ---
        function downloadIDCard() {
            const card = document.getElementById('id-card-node');
            html2canvas(card, { 
                scale: 2, 
                useCORS: true,
                width: 320, 
                height: 480 
            }).then(canvas => {
                const a = document.createElement('a');
                a.download = `Qualification-Card-${state.examUser.name}.png`;
                a.href = canvas.toDataURL("image/png");
                a.click();
            });
        }

        function downloadReportCardPDF() {
            const total = state.examQuestions.length;
            const percentage = Math.round((state.examScore / total) * 100);
            
            const reportDiv = document.createElement('div');
            reportDiv.className = "w-[800px] bg-white p-10 font-sans text-slate-800";
            reportDiv.style.position = "absolute";
            reportDiv.style.left = "-9999px";
            
            let htmlContent = `
                <div class="border-b-2 border-slate-300 pb-6 mb-6">
                    <h1 class="text-3xl font-black uppercase text-indigo-700">Exam Report Card</h1>
                    <p class="text-lg font-bold mt-2">Candidate: ${state.examUser.name}</p>
                    <p class="text-slate-600">Mobile: ${state.examUser.mobile}</p>
                    <p class="text-slate-600">Date: ${new Date().toLocaleDateString()}</p>
                    <p class="text-xl font-bold mt-2 ${percentage >= 80 ? 'text-green-600' : 'text-red-600'}">Final Score: ${percentage}% (${state.examScore} / ${total})</p>
                </div>
                <div>
            `;

            state.examHistory.forEach((h, i) => {
                htmlContent += `
                    <div class="mb-4 p-4 border rounded-xl ${h.isCorrect ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}">
                        <p class="font-bold text-base mb-2">Q${i+1}. ${h.question}</p>
                        <p class="text-sm">Your Answer: <span class="font-bold ${h.isCorrect ? 'text-green-700' : 'text-red-700'}">${h.userAnswer}</span></p>
                        ${!h.isCorrect ? `<p class="text-sm text-green-700 font-bold mt-1">Correct Answer: ${h.correctAnswer}</p>` : ''}
                    </div>
                `;
            });

            htmlContent += `</div>`;
            reportDiv.innerHTML = htmlContent;
            document.body.appendChild(reportDiv);

            html2canvas(reportDiv, { scale: 2, useCORS: true }).then(canvas => {
                const imgData = canvas.toDataURL('image/jpeg', 0.9);
                const pdf = new window.jspdf.jsPDF('p', 'pt', [canvas.width, canvas.height]);
                pdf.addImage(imgData, 'JPEG', 0, 0, canvas.width, canvas.height);
                pdf.save(`Exam-Report-${state.examUser.name}.pdf`);
                
                document.body.removeChild(reportDiv);
            });
        }

        // --- RENDER UI ---
        function render() {
            const container = document.getElementById('app-content');
            
            if (state.loading) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-20">
                        <div class="loader ease-linear rounded-full border-4 border-t-4 border-indigo-600 h-12 w-12 mb-4"></div>
                        <p class="text-slate-500 font-medium">Please wait...</p>
                    </div>`;
                return;
            }

            let html = '';

            // HOME
            if (state.view === 'home') {
                html = `
                    <main class="w-full max-w-md p-4 fade-in text-center">
                        <div class="mb-10 mt-6">
                            <div class="w-20 h-20 bg-indigo-50 rounded-full flex items-center justify-center mx-auto mb-6 text-indigo-600 border border-indigo-100 shadow-sm">
                                <i data-lucide="shield-check" style="width:40px;height:40px;"></i>
                            </div>
                            <h1 class="text-3xl font-black text-slate-800 tracking-tight leading-tight mb-2">Scaffolding Portal</h1>
                            <p class="text-slate-500 text-sm">Prepare and Qualify</p>
                        </div>

                        <div class="space-y-4">
                            <button onclick="state.trainingTab='qa'; state.view='training'; render();" class="w-full bg-indigo-50 border border-indigo-200 text-indigo-700 py-4 rounded-xl font-bold hover:bg-indigo-100 transition-all flex items-center justify-center gap-3">
                                <i data-lucide="book-open" style="width:20px;"></i>
                                <span>Training Materials</span>
                            </button>
                            
                            <button onclick="startExamRegistration()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-slate-800 transition-all flex items-center justify-center gap-3">
                                <i data-lucide="graduation-cap" style="width:20px;"></i>
                                <span>Start Assessment</span>
                            </button>
                        </div>
                    </main>
                `;
            }

            // TRAINING MATERIALS (New View)
            else if (state.view === 'training') {
                let tabContent = '';
                
                if (state.trainingTab === 'qa') {
                    tabContent = `
                        <div class="space-y-4 pb-8">
                            ${state.questions.map((q, i) => `
                                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Question ${i+1}</p>
                                    <h3 class="font-bold text-slate-800 mb-3 leading-snug">${q.q}</h3>
                                    <div class="bg-green-50 p-3 rounded-lg border border-green-100">
                                        <p class="text-sm text-green-800"><span class="font-bold uppercase text-xs mr-1">Correct Answer:</span> ${q.a}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else if (state.trainingTab === 'equip') {
                    const hasEquip = state.equipment.length > 0;
                    tabContent = `
                        ${!hasEquip ? `<div class="text-center p-10 bg-slate-50 rounded-2xl border border-dashed border-slate-300"><p class="text-slate-500 font-medium">No equipment data available</p></div>` : `
                        <div class="grid grid-cols-2 gap-3 pb-8">
                            ${state.equipment.map(eq => `
                                <div onclick="viewItem('${eq.id}')" class="bg-white rounded-xl border border-slate-200 overflow-hidden cursor-pointer hover:border-indigo-400 transition-all shadow-sm group">
                                    <div class="aspect-square bg-slate-50 p-2 relative">
                                        ${eq.image ? `<img src="${processImageUrl(eq.image)}" class="w-full h-full object-contain" />` : `<div class="w-full h-full flex items-center justify-center text-slate-300"><i data-lucide="image"></i></div>`}
                                        <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center"><span class="text-white text-xs font-bold border border-white px-3 py-1 rounded">View</span></div>
                                    </div>
                                    <div class="p-3 border-t border-slate-100 text-center">
                                        <h3 class="text-sm font-bold text-slate-800 line-clamp-2">${eq.name}</h3>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        `}
                    `;
                }

                html = `
                    <main class="w-full max-w-md p-4 fade-in">
                        <div class="text-center mb-6">
                            <h2 class="text-2xl font-black text-slate-800">Training Materials</h2>
                            <p class="text-slate-500 text-sm">Study before taking the exam.</p>
                        </div>
                        
                        <!-- Tabs -->
                        <div class="flex p-1 bg-slate-100 rounded-xl mb-6">
                            <button onclick="state.trainingTab='qa'; render();" class="flex-1 py-2 text-sm font-bold rounded-lg transition-all ${state.trainingTab === 'qa' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500 hover:text-slate-700'}">Questions & Answers</button>
                            <button onclick="state.trainingTab='equip'; render();" class="flex-1 py-2 text-sm font-bold rounded-lg transition-all ${state.trainingTab === 'equip' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500 hover:text-slate-700'}">Equipment Library</button>
                        </div>
                        
                        <!-- Tab Content -->
                        ${tabContent}
                        
                        <button onclick="state.view='home'; render();" class="w-full border-2 border-slate-200 py-3.5 rounded-xl font-bold text-slate-600 hover:bg-slate-50 transition-colors mt-2">
                            Back to Home
                        </button>
                    </main>
                `;
            }

            // EXAM REGISTER
            else if (state.view === 'exam-register') {
                html = `
                    <main class="w-full max-w-md p-4 fade-in">
                        <div class="bg-white p-6 sm:p-8 rounded-2xl border border-slate-200 shadow-sm">
                            <div class="text-center mb-6">
                                <h2 class="text-2xl font-black text-slate-800 mb-2">Candidate Details</h2>
                                <p class="text-sm text-slate-500">Provide details to begin your exam.</p>
                            </div>
                            
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1 ml-1">Full Name</label>
                                    <input type="text" id="regName" class="w-full p-4 rounded-xl bg-slate-50 border border-slate-200 focus:border-indigo-500 focus:outline-none font-bold text-slate-800 placeholder-slate-400" placeholder="Enter your full name">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1 ml-1">Mobile Number</label>
                                    <input type="tel" id="regMobile" class="w-full p-4 rounded-xl bg-slate-50 border border-slate-200 focus:border-indigo-500 focus:outline-none font-bold text-slate-800 placeholder-slate-400" placeholder="10-digit mobile number">
                                </div>
                                <button onclick="handleRegistration()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold hover:bg-indigo-700 transition-colors mt-2 flex items-center justify-center gap-2 shadow-md">
                                    <span>Continue</span>
                                    <i data-lucide="arrow-right" style="width:18px"></i>
                                </button>
                                <button onclick="state.view='home'; render();" class="w-full text-slate-400 text-sm font-medium py-2 hover:text-slate-600">Cancel</button>
                            </div>
                        </div>
                    </main>
                `;
            }

            // EXAM INSTRUCTIONS
            else if (state.view === 'exam-instructions') {
                html = `
                    <main class="w-full max-w-md p-4 fade-in">
                        <div class="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 shadow-sm">
                            <h2 class="text-xl font-black text-slate-800 mb-4 text-center border-b border-slate-100 pb-3">निर्देश (Test Instructions)</h2>
                            <div class="space-y-3 text-[13px] text-slate-600 font-medium mb-6 leading-relaxed">
                                <p>• कृपया इस टेस्ट को किसी शांत स्थान पर बैठकर दें।</p>
                                <p>• किसी भी व्यक्ति से मदद न लें।</p>
                                <p>• हर प्रश्न को ध्यान से पढ़ें और सोच-समझकर उत्तर दें।</p>
                                
                                <p class="font-bold text-slate-800 mt-4 border-t border-slate-100 pt-3">इस टेस्ट के दौरान:</p>
                                <ul class="list-disc pl-5 space-y-1">
                                    <li>गूगल सर्च बिल्कुल न करें।</li>
                                    <li>किसी भी प्रकार की चीटिंग न करें।</li>
                                    <li>यह टेस्ट केवल आपकी फाइनल इंटरव्यू की तैयारी के लिए है।</li>
                                </ul>
                                
                                <p class="mt-4 border-t border-slate-100 pt-3">टेस्ट पूरा होने के बाद आपको आपकी टेस्ट रिपोर्ट मिलेगी, जिसमें आपके सही और गलत उत्तर स्पष्ट रूप से दिखाई देंगे।</p>
                                <p>यदि आप पास नहीं होते हैं तो चिंता की कोई बात नहीं है। आप दोबारा प्रयास कर सकते हैं।</p>
                                <p>जब तक आप <span class="font-bold text-red-600 text-sm">न्यूनतम 80% अंक</span> प्राप्त करके पास नहीं हो जाते, तब तक अभ्यास करते रहें। लगातार प्रयास ही सफलता की कुंजी है।</p>
                                <p>जब आप 80% या उससे अधिक अंक प्राप्त कर लेंगे, तो आपको एक Qualify Card मिलेगा।</p>
                                <p>उस Qualify Card को आपको Admin को भेजना होगा, जिसके बाद आपका Gate Pass Process शुरू किया जाएगा।</p>
                                
                                <p class="font-bold text-indigo-700 text-center mt-5 pt-3 border-t border-slate-100">कृपया ईमानदारी से टेस्ट दें<br>यह आपके भविष्य और करियर के लिए महत्वपूर्ण है।</p>
                            </div>
                            <button onclick="startAssessmentAfterInstructions()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold shadow-md hover:bg-indigo-700 transition-colors flex items-center justify-center gap-2">
                                <span>Start Assessment</span>
                                <i data-lucide="arrow-right" style="width:18px"></i>
                            </button>
                        </div>
                    </main>
                `;
            }

            // EXAM ACTIVE (FLASHCARD STYLE)
            else if (state.view === 'exam-active') {
                const q = state.examQuestions[state.examCurrentIdx];
                const history = state.examHistory[state.examCurrentIdx];
                const isRevealed = state.examAnswerRevealed;
                
                let optionsHtml = q.options.map(opt => {
                    const safeOpt = opt.replace(/'/g, "\\'");
                    let btnClasses = "w-full text-left p-4 rounded-xl border-2 transition-all font-medium text-sm ";
                    
                    if (!isRevealed) {
                        btnClasses += "border-slate-200 bg-white text-slate-700 hover:border-indigo-400 cursor-pointer shadow-sm";
                        return `<button onclick="submitExamAnswer('${safeOpt}')" class="${btnClasses}">${opt}</button>`;
                    } else {
                        if (opt === q.correct) {
                            btnClasses += "border-green-500 bg-green-50 text-green-700 relative";
                            return `<div class="${btnClasses}">${opt} <span class="absolute right-4 top-1/2 -translate-y-1/2"><i data-lucide="check-circle-2"></i></span></div>`;
                        } else if (history && opt === history.userAnswer) {
                            btnClasses += "border-red-500 bg-red-50 text-red-700 relative";
                            return `<div class="${btnClasses}">${opt} <span class="absolute right-4 top-1/2 -translate-y-1/2"><i data-lucide="x"></i></span></div>`;
                        } else {
                            btnClasses += "border-slate-100 bg-slate-50 text-slate-400 opacity-60";
                            return `<div class="${btnClasses}">${opt}</div>`;
                        }
                    }
                }).join('');

                html = `
                    <main class="w-full max-w-md p-4 fade-in">
                        <div class="flex items-center justify-between mb-4">
                            <span class="text-xs font-bold text-slate-500 tracking-wider">QUESTION ${state.examCurrentIdx + 1} OF ${state.examQuestions.length}</span>
                            <span class="text-xs font-bold text-slate-400">Assessment</span>
                        </div>
                        
                        <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden mb-6">
                            <div class="bg-indigo-600 h-full transition-all duration-300" style="width: ${((state.examCurrentIdx + 1) / state.examQuestions.length) * 100}%"></div>
                        </div>

                        <div class="bg-white rounded-2xl border border-slate-200 p-6 min-h-[350px] flex flex-col shadow-sm">
                            ${q.type === 'image' 
                                ? `<div class="h-48 bg-slate-50 rounded-xl mb-4 flex items-center justify-center border border-slate-100 overflow-hidden"><img src="${processImageUrl(q.image)}" class="h-full object-contain" onerror="this.style.display='none'"></div>` 
                                : ''
                            }
                            
                            <h3 class="text-lg font-bold text-slate-800 mb-6 leading-relaxed">${q.question}</h3>
                            
                            <div class="space-y-3 mt-auto">
                                ${optionsHtml}
                            </div>
                            
                            ${isRevealed ? `
                                <div class="mt-8">
                                    <button onclick="nextQuestion()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold hover:bg-slate-800 transition-colors shadow-md flex items-center justify-center gap-2">
                                        <span>Next Question</span>
                                        <i data-lucide="arrow-right" style="width:18px;"></i>
                                    </button>
                                </div>
                            ` : ''}
                        </div>
                    </main>
                `;
            }

            // EXAM PASSED - DETAILS COLLECTION
            else if (state.view === 'exam-pass-details') {
                const percentage = Math.round((state.examScore / state.examQuestions.length) * 100);
                html = `
                    <main class="w-full max-w-md p-4 fade-in">
                        <div class="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 shadow-sm text-center">
                            <div class="w-16 h-16 bg-green-50 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4 border border-green-100">
                                <i data-lucide="check" style="width:32px;height:32px;"></i>
                            </div>
                            <h2 class="text-2xl font-black text-slate-800">Exam Passed!</h2>
                            <p class="text-green-600 font-bold text-lg mb-6">Score: ${percentage}%</p>
                            
                            <p class="text-slate-500 text-sm mb-6">Provide details to generate your Qualification Card.</p>
                            
                            <div class="space-y-5 text-left">
                                <div>
                                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2 text-center">Passport Size Photo</label>
                                    <div class="relative w-28 h-28 mx-auto bg-slate-50 rounded-xl border-2 border-dashed border-slate-300 flex items-center justify-center overflow-hidden cursor-pointer hover:border-indigo-500 transition-colors">
                                        <input type="file" accept="image/*" onchange="handlePhotoUpload(this)" class="absolute inset-0 opacity-0 cursor-pointer z-20">
                                        <img id="photo-preview" class="hidden w-full h-full object-cover z-10">
                                        <div id="photo-placeholder" class="text-center text-slate-400">
                                            <i data-lucide="camera" class="mx-auto mb-1"></i>
                                        </div>
                                    </div>
                                </div>
                                
                                <div>
                                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1 ml-1 text-center">Aadhaar Number</label>
                                    <input type="text" id="aadhaarInput" class="w-full p-4 rounded-xl bg-slate-50 border border-slate-200 focus:border-indigo-500 focus:outline-none font-bold text-slate-800 text-center tracking-widest placeholder-slate-300" placeholder="12-Digit Number">
                                </div>

                                <button onclick="generateIDCardAndSave()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold shadow-md hover:bg-indigo-700 transition-colors mt-2">
                                    Generate Card
                                </button>
                            </div>
                        </div>
                    </main>
                `;
            }

            // EXAM PASSED - SHOW ID CARD
            else if (state.view === 'exam-id-card') {
                const percentage = Math.round((state.examScore / state.examQuestions.length) * 100);
                html = `
                    <main class="w-full max-w-md p-4 fade-in flex flex-col items-center">
                        <div class="mb-6 text-center">
                            <h2 class="text-2xl font-black text-slate-800">Congratulations</h2>
                            <p class="text-slate-500 text-sm mt-1">Your card and report are downloading.</p>
                        </div>

                        <!-- ID CARD PREVIEW -->
                        <div id="id-card-node" class="id-card-container flex flex-col mb-8 bg-white shadow-xl">
                            <!-- Header -->
                            <div class="bg-green-600 text-white p-5 text-center relative">
                                <div class="border border-white/40 px-4 py-1.5 rounded-md bg-green-700/50 inline-flex items-center gap-2 mb-2">
                                    <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                                    <h1 class="text-lg font-black tracking-widest uppercase">QUALIFIED</h1>
                                </div>
                                <p class="text-[10px] text-green-100 tracking-wider uppercase font-bold">For Final Interview</p>
                            </div>
                            
                            <!-- Content -->
                            <div class="flex-1 p-6 flex flex-col items-center">
                                <div class="w-24 h-24 rounded-lg border border-slate-200 overflow-hidden mb-4 bg-slate-50 shrink-0 shadow-sm">
                                    <img src="${state.examUser.photo}" class="w-full h-full object-cover">
                                </div>
                                
                                <h2 class="text-xl font-extrabold text-slate-900 uppercase leading-snug mb-1 text-center">${state.examUser.name}</h2>
                                <p class="text-xs text-slate-500 font-bold mb-5">ID: ${state.examUser.trainingId}</p>
                                
                                <div class="w-full space-y-2 text-left text-xs border-t border-slate-100 pt-5">
                                    <div class="flex justify-between">
                                        <span class="text-slate-500 font-medium">Mobile:</span>
                                        <span class="text-slate-900 font-bold">${state.examUser.mobile}</span>
                                    </div>
                                    <div class="flex justify-between">
                                        <span class="text-slate-500 font-medium">Aadhaar:</span>
                                        <span class="text-slate-900 font-bold">${state.examUser.aadhaar}</span>
                                    </div>
                                    <div class="flex justify-between">
                                        <span class="text-slate-500 font-medium">Score:</span>
                                        <span class="text-green-600 font-extrabold">${percentage}%</span>
                                    </div>
                                    <div class="flex justify-between">
                                        <span class="text-slate-500 font-medium">Date:</span>
                                        <span class="text-slate-900 font-bold">${new Date().toLocaleDateString()}</span>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Footer -->
                            <div class="mt-auto pt-3 pb-5 px-6 border-t border-slate-100 flex justify-end">
                                <div class="text-right">
                                    <div class="signature-font text-slate-800 mb-1 leading-none transform -rotate-6" style="font-size: 16px;">GS</div>
                                    <div class="h-px w-16 bg-slate-300 ml-auto mb-1"></div>
                                    <p class="text-[8px] text-slate-400 uppercase tracking-widest font-bold">Auth. Sign</p>
                                </div>
                            </div>
                        </div>

                        <div class="space-y-3 w-full max-w-xs">
                            <button onclick="downloadIDCard()" class="w-full bg-slate-900 text-white py-3.5 rounded-xl font-bold hover:bg-slate-800 flex items-center justify-center gap-2 transition-colors">
                                <i data-lucide="download"></i> Download ID Card
                            </button>
                            <button onclick="downloadReportCardPDF()" class="w-full bg-indigo-600 text-white py-3.5 rounded-xl font-bold hover:bg-indigo-700 flex items-center justify-center gap-2 transition-colors">
                                <i data-lucide="file-text"></i> Download Report Card
                            </button>
                            <button onclick="state.view='home'; render();" class="w-full border-2 border-slate-200 py-3.5 rounded-xl font-bold text-slate-600 hover:bg-slate-50 transition-colors">
                                Return Home
                            </button>
                        </div>
                    </main>
                `;
            }

            // EXAM FAIL
            else if (state.view === 'exam-fail') {
                const total = state.examQuestions.length;
                const percentage = Math.round((state.examScore / total) * 100);
                html = `
                    <main class="w-full max-w-md p-4 fade-in">
                        <div class="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 shadow-sm text-center">
                            <div class="w-20 h-20 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6 border border-red-100">
                                <i data-lucide="x-circle" style="width:40px;height:40px;"></i>
                            </div>
                            <h2 class="text-2xl font-black text-slate-800 mb-2">Not Qualified</h2>
                            <p class="text-red-500 font-bold text-xl mb-4">Score: ${percentage}%</p>
                            
                            <div class="bg-slate-50 p-4 rounded-xl text-sm text-slate-600 mb-8 border border-slate-100">
                                A minimum of <strong>80%</strong> is required to qualify. Please review your downloaded report card and try again later.
                            </div>
                            
                            <div class="w-full space-y-3">
                                <button onclick="downloadReportCardPDF()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold shadow-md hover:bg-indigo-700 transition-colors flex items-center justify-center gap-2">
                                    <i data-lucide="file-text"></i> Download Report Card
                                </button>
                                <button onclick="state.view='home'; render();" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold shadow-md hover:bg-slate-800 transition-colors">
                                    Return Home
                                </button>
                            </div>
                        </div>
                    </main>
                `;
            }

            container.innerHTML = html;
            lucide.createIcons();
        }

        // Initialize
        fetchSheetData();
    </script>
</body>
</html>
