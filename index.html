<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile App Hub</title>
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Modern UI Tweaks */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f8fafc; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .ios-scroll { -webkit-overflow-scrolling: touch; }
        
        .loader {
            border-top-color: #3b82f6;
            animation: spinner 1s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Coffee Button Floating Animation */
        .coffee-float { animation: float 3s ease-in-out infinite; }
        @keyframes float { 
            0%, 100% { transform: translateY(0px); } 
            50% { transform: translateY(-8px); } 
        }

        /* Ticker Animation */
        .ticker-container {
            overflow: hidden;
            white-space: nowrap;
        }
        .ticker-content {
            display: inline-block;
            padding-left: 100%;
            animation: ticker 25s linear infinite;
        }
        @keyframes ticker {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 h-screen w-screen overflow-hidden">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- CONFIGURATION ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwX-IYZ0Kwwg6abtD--dfHslPEfNnlLvWkYJZRNOjHg65xndMaINSiq-8gumgheK9SPoA/exec"; 
        const UPI_ID = "dearhappy@sbi";

        const Ticker = ({ supporters }) => {
            if (!supporters || supporters.length === 0) return null;
            
            return (
                <div className="bg-yellow-400 border-b border-yellow-500 py-1.5 ticker-container">
                    <div className="ticker-content">
                        {supporters.map((s, i) => (
                            <span key={i} className="mx-8 text-xs font-black text-slate-900 uppercase tracking-tighter">
                                <i className="fa-solid fa-crown mr-2"></i>
                                Top Supporter: {s.name} — Amount: ₹{s.amount}
                            </span>
                        ))}
                        {/* Repeat for seamless loop */}
                        {supporters.map((s, i) => (
                            <span key={`dup-${i}`} className="mx-8 text-xs font-black text-slate-900 uppercase tracking-tighter">
                                <i className="fa-solid fa-crown mr-2"></i>
                                Top Supporter: {s.name} — Amount: ₹{s.amount}
                            </span>
                        ))}
                    </div>
                </div>
            );
        };

        const Header = ({ onSearch, searchTerm }) => (
            <div className="bg-white/90 backdrop-blur-md border-b border-slate-200 px-5 py-4 sticky top-0 z-20">
                <div className="flex items-center justify-between mb-4">
                    <div className="flex items-center space-x-2">
                        <div className="bg-blue-600 p-2 rounded-lg">
                            <i className="fa-solid fa-rocket text-white"></i>
                        </div>
                        <h1 className="text-xl font-bold text-slate-800 tracking-tight">Launchpad</h1>
                    </div>
                    <div className="h-9 w-9 rounded-full bg-slate-100 border border-slate-200 flex items-center justify-center text-slate-500">
                        <i className="fa-solid fa-user-circle text-xl"></i>
                    </div>
                </div>
                <div className="relative">
                    <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input 
                        type="text" 
                        placeholder="Search your apps..." 
                        value={searchTerm}
                        onChange={(e) => onSearch(e.target.value)}
                        className="w-full bg-slate-100 border-none rounded-xl pl-11 pr-4 py-3 text-sm focus:ring-2 focus:ring-blue-500/20 transition-all outline-none"
                    />
                </div>
            </div>
        );

        const AppCard = ({ name, url }) => {
            const handleClick = () => {
                if (url) window.location.href = url;
            };

            return (
                <button 
                    onClick={handleClick} 
                    className="bg-white p-6 rounded-2xl border-2 border-slate-200 shadow-sm active:scale-95 hover:border-blue-500 hover:shadow-md transition-all duration-200 flex items-center justify-center min-h-[100px] w-full group"
                >
                    <span className="text-lg font-bold text-slate-800 text-center leading-tight group-hover:text-blue-600 transition-colors">
                        {name}
                    </span>
                </button>
            );
        };

        const CoffeeButton = () => {
            const openSupport = () => {
                const tr = Math.floor(Math.random() * 1000000000);
                const upiLink = `upi://pay?pa=${UPI_ID}&pn=Support&mc=0000&mode=00&tn=CoffeeSupport&tr=${tr}&cu=INR`;
                window.location.href = upiLink;
            };

            return (
                <div className="fixed bottom-6 right-6 z-50 flex flex-col items-center cursor-pointer group" onClick={openSupport}>
                    <div className="mb-2 coffee-float">
                        <div className="bg-yellow-400 text-slate-900 text-[10px] font-black px-3 py-1.5 rounded-lg shadow-md whitespace-nowrap relative border border-yellow-500">
                            BUY ME A COFFEE
                            <div className="absolute -bottom-1 left-1/2 -translate-x-1/2 w-2 h-2 bg-yellow-400 rotate-45 border-b border-r border-yellow-500"></div>
                        </div>
                    </div>
                    <div className="bg-slate-900 text-white p-4 rounded-full shadow-2xl border-2 border-yellow-400 hover:scale-110 hover:bg-slate-800 transition-all duration-300">
                        <i className="fa-solid fa-coffee text-xl"></i>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [apps, setApps] = useState([]);
            const [supporters, setSupporters] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [searchTerm, setSearchTerm] = useState("");

            useEffect(() => {
                const fetchData = async () => {
                    try {
                        const response = await fetch(SCRIPT_URL);
                        const data = await response.json();
                        
                        // We check if data is an array (original format) or an object (new format)
                        if (Array.isArray(data)) {
                            // Extract apps from columns A/B and supporters from columns C/D if included in the row data
                            setApps(data);
                            // Logic to filter non-empty supporters from the same response rows
                            const sups = data
                                .filter(item => item.supporter && item.amount)
                                .map(item => ({ name: item.supporter, amount: item.amount }));
                            setSupporters(sups);
                        } else if (data.apps) {
                            setApps(data.apps);
                            setSupporters(data.supporters || []);
                        }
                    } catch (err) {
                        console.error("Fetch error:", err);
                        setError("Check connection or script deployment.");
                    } finally {
                        setLoading(false);
                    }
                };
                fetchData();
            }, []);

            const filteredApps = useMemo(() => {
                return apps.filter(app => 
                    app.name.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }, [apps, searchTerm]);

            return (
                <div className="h-full flex flex-col max-w-lg mx-auto bg-white border-x border-slate-200 shadow-xl overflow-hidden relative">
                    <Ticker supporters={supporters} />
                    <Header searchTerm={searchTerm} onSearch={setSearchTerm} />
                    
                    <main className="flex-1 overflow-y-auto ios-scroll p-6">
                        {loading ? (
                            <div className="flex flex-col items-center justify-center h-64 text-slate-400">
                                <div className="loader ease-linear rounded-full border-4 border-slate-100 h-12 w-12 mb-4"></div>
                                <p className="animate-pulse">Loading Hub...</p>
                            </div>
                        ) : error ? (
                            <div className="text-center p-10 bg-red-50 rounded-3xl border border-red-100">
                                <i className="fa-solid fa-triangle-exclamation text-2xl text-red-500 mb-4"></i>
                                <h3 className="text-red-800 font-bold mb-2">Connection Error</h3>
                                <p className="text-red-600 text-sm mb-4">{error}</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pb-24">
                                {filteredApps.map((app, index) => (
                                    <AppCard 
                                        key={index} 
                                        name={app.name} 
                                        url={app.url} 
                                    />
                                ))}
                            </div>
                        )}
                    </main>

                    <CoffeeButton />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
