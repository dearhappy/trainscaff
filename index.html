<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScaffoldMaster - By Gurwinder Singh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Added html2canvas for card downloading -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Added Google Font for Signature -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .loader { border-top-color: #EAB308; -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .coffee-float { animation: float 3s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-5px); } 100% { transform: translateY(0px); } }

        .content-enter { animation: contentEnter 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes contentEnter {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .shimmer {
            background: linear-gradient(to right, #fefce8 0%, #fef08a 50%, #fefce8 100%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

        /* ID Card Specific Styles */
        .id-card-container {
            width: 320px;
            height: 520px; 
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
            position: relative;
        }
        .signature-font {
            font-family: 'Great Vibes', cursive;
            font-size: 20px; /* Reduced base size */
        }

        /* Ticker Animation */
        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            box-sizing: border-box;
        }
        .ticker {
            display: inline-block;
            padding-left: 100%;
            animation: ticker 25s linear infinite; /* Slower animation for readability */
        }
        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-10">

    <!-- Header -->
    <header class="bg-slate-900 text-white p-4 sticky top-0 z-50 flex flex-col shadow-md">
        <div class="flex items-center justify-between w-full">
            <div class="flex items-center gap-2 cursor-pointer" onclick="navigate('home')">
                <div class="bg-yellow-500 p-1.5 rounded-lg text-slate-900">
                    <i data-lucide="shield-check"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">ScaffoldMaster</h1>
                    <p class="text-[10px] uppercase tracking-widest text-yellow-500 font-semibold text-left">By Gurwinder Singh</p>
                </div>
            </div>
            <button onclick="toggleSidebar()" class="p-2 hover:bg-slate-800 rounded-full">
                <i data-lucide="menu" id="menu-icon"></i>
            </button>
        </div>
    </header>

    <!-- Ticker Section -->
    <div class="bg-indigo-900 text-indigo-100 text-xs py-2 border-t border-indigo-800 relative z-40">
        <div class="ticker-wrap">
            <div id="news-ticker" class="ticker font-mono font-bold uppercase tracking-wide">
                Welcome to ScaffoldMaster • Safety First • Always Wear PPE • Complete your Training & Exam to get Certified
            </div>
        </div>
    </div>

    <!-- Sidebar -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 backdrop-blur-sm hidden" onclick="toggleSidebar()">
        <div class="absolute right-0 top-0 bottom-0 w-64 bg-white p-6 shadow-2xl transition-transform" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="info" class="text-yellow-600"></i> मेनू
                </h2>
                <button onclick="toggleSidebar()" class="text-slate-400"><i data-lucide="x"></i></button>
            </div>
            <nav class="space-y-4">
                <button onclick="navigate('home')" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-slate-100 text-left font-medium transition-colors">
                    <i data-lucide="home"></i> मुख्य पृष्ठ
                </button>
                <button onclick="navigate('study')" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-slate-100 text-left font-medium transition-colors">
                    <i data-lucide="book-open"></i> ट्रेनिंग सामग्री
                </button>
                <button onclick="navigate('equipment')" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-slate-100 text-left font-medium transition-colors">
                    <i data-lucide="hammer"></i> टूल्स और उपकरण
                </button>
                <button onclick="startQuiz()" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-slate-100 text-left font-medium transition-colors">
                    <i data-lucide="trophy"></i> नॉलेज टेस्ट (Quiz)
                </button>
                <!-- EXAM MENU ITEM -->
                <button onclick="navigate('exam-intro')" class="w-full flex items-center gap-3 p-3 rounded-lg bg-indigo-50 text-indigo-700 hover:bg-indigo-100 text-left font-medium transition-colors">
                    <i data-lucide="graduation-cap"></i> फाइनल परीक्षा (Exam)
                </button>
            </nav>
            <div class="absolute bottom-10 left-6 right-6 p-4 bg-yellow-50 rounded-xl border border-yellow-100 text-xs text-yellow-800">
                <p class="font-bold mb-1">सुरक्षा पहले!</p>
                हमेशा PPE का उपयोग करें और टैग की जांच करें।
            </div>
        </div>
    </div>

    <!-- Container for Views -->
    <div id="app-content"></div>

    <!-- Floating Coffee Button -->
    <div id="coffee-fab" class="fixed bottom-6 right-6 z-50 flex flex-col items-center cursor-pointer group" onclick="openPaymentModal()">
        <div class="mb-1 coffee-float">
            <div class="bg-yellow-400 text-slate-900 text-[10px] font-black px-3 py-1.5 rounded-lg shadow-md whitespace-nowrap relative border border-yellow-500">
                BUY ME A COFFEE
                <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-2 h-2 bg-yellow-400 rotate-45 border-b border-r border-yellow-500"></div>
            </div>
        </div>
        <div class="bg-slate-900 text-white p-3.5 rounded-full shadow-2xl border-2 border-yellow-400 hover:scale-110 hover:bg-slate-800 transition-all duration-300">
            <i data-lucide="coffee" style="width: 24px; height: 24px;"></i>
        </div>
    </div>

    <!-- Item Modal -->
    <div id="item-modal" class="fixed inset-0 bg-black/90 z-[60] hidden flex items-center justify-center p-2 backdrop-blur-sm transition-opacity" onclick="closeItem()"></div>

    <!-- Payment Modal -->
    <div id="payment-modal" class="fixed inset-0 bg-black/80 z-[70] hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity" onclick="closePaymentModal()"></div>

    <script>
        // --- CONFIGURATION ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz4FLd0mdJRn_4penuuIZdpReRSZLclucTt5WfGZGsCslZDvag3fX8w62AvlbBYASGb/exec"; 
        const UPI_ID = "dearhappy@sbi";
        const PAYEE_NAME = "Gurwinder Singh";

        // --- GLOBAL STATE ---
        let state = {
            view: 'home',
            questions: [],
            equipment: [],
            loading: false,
            dataLoaded: false,
            candidates: [], // Stores ticker data
            
            // Quiz State
            currentIdx: 0,
            score: 0,
            showAnswer: false,
            userSelections: [],
            filter: 'All',
            
            // Exam State
            examUser: { name: '', mobile: '', aadhaar: '', photo: null, trainingId: '' },
            examQuestions: [],
            examCurrentIdx: 0,
            examScore: 0,
            
            // UI State
            sidebarOpen: false,
            selectedItem: null,
            selectedItemIndex: -1
        };

        // --- CORE FUNCTIONS ---
        function processImageUrl(url) {
            if (!url) return null;
            if (url.includes('drive.google.com') || url.includes('docs.google.com')) {
                const idMatch = url.match(/\/d\/([^/]+)/);
                if (idMatch && idMatch[1]) return `https://lh3.googleusercontent.com/d/${idMatch[1]}`;
            }
            return url;
        }

        async function fetchSheetData() {
            if (!SCRIPT_URL) return;
            state.loading = true;
            render(); 
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                if (data.questions?.length > 0) state.questions = data.questions;
                if (data.equipment?.length > 0) state.equipment = data.equipment;
                if (data.candidates?.length > 0) {
                    state.candidates = data.candidates;
                    updateTicker();
                }
                state.dataLoaded = true;
            } catch (error) { console.error("Data error", error); } 
            finally { state.loading = false; render(); }
        }

        function updateTicker() {
            const ticker = document.getElementById('news-ticker');
            if (ticker && state.candidates.length > 0) {
                // Reverse to show latest first
                const list = [...state.candidates].reverse();
                // Ensure score shows as 96% and not 0.96
                const tickerText = list.map(c => {
                    let displayScore = c.score;
                    // If score is a decimal like 0.96, convert to 96%
                    if (!isNaN(displayScore) && displayScore <= 1 && displayScore > 0) {
                        displayScore = Math.round(displayScore * 100) + "%";
                    }
                    // If score is just a number like 96, append %
                    else if (!isNaN(displayScore) && String(displayScore).indexOf('%') === -1) {
                        displayScore = displayScore + "%";
                    }
                    return `🎉 ${c.name} (${displayScore})`;
                }).join(' • ');
                
                ticker.innerHTML = `RECENTLY CERTIFIED: ${tickerText} • JOIN THE LEAGUE OF SAFE SCAFFOLDERS`;
            }
        }

        // --- EXAM LOGIC ---
        function startExamRegistration() {
            navigate('exam-register');
        }

        function generateExamQuestions() {
            // 20 Text Questions
            const textPool = [...state.questions].sort(() => 0.5 - Math.random());
            const textQs = textPool.slice(0, 20).map(q => {
                const others = state.questions.filter(x => x.id !== q.id).map(x => x.a);
                const wrong = others.sort(() => 0.5 - Math.random()).slice(0, 2);
                return {
                    type: 'text',
                    question: q.q,
                    correct: q.a,
                    options: [q.a, ...wrong].sort(() => 0.5 - Math.random())
                };
            });

            // 5 Image Questions (if available)
            let imgQs = [];
            if (state.equipment.length >= 5) {
                const imgPool = [...state.equipment].sort(() => 0.5 - Math.random());
                imgQs = imgPool.slice(0, 5).map(eq => {
                    const others = state.equipment.filter(x => x.id !== eq.id).map(x => x.name);
                    const wrong = others.sort(() => 0.5 - Math.random()).slice(0, 2);
                    return {
                        type: 'image',
                        image: eq.image,
                        question: "इस उपकरण को पहचानें (Identify this equipment):",
                        correct: eq.name,
                        options: [eq.name, ...wrong].sort(() => 0.5 - Math.random())
                    };
                });
            }

            state.examQuestions = [...textQs, ...imgQs].sort(() => 0.5 - Math.random());
            state.examCurrentIdx = 0;
            state.examScore = 0;
            navigate('exam-active');
        }

        function submitExamAnswer(selectedOption) {
            const currentQ = state.examQuestions[state.examCurrentIdx];
            if (selectedOption === currentQ.correct) {
                state.examScore++;
            }

            if (state.examCurrentIdx + 1 < state.examQuestions.length) {
                state.examCurrentIdx++;
                render();
            } else {
                checkExamResult();
            }
        }

        function checkExamResult() {
            const total = state.examQuestions.length;
            const percentage = Math.round((state.examScore / total) * 100);
            const passed = percentage >= 60;

            if (passed) {
                navigate('exam-pass-details');
            } else {
                saveFailedResult(percentage);
            }
        }

        // Handle Photo Upload
        function handlePhotoUpload(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    state.examUser.photo = e.target.result;
                    // Show preview
                    document.getElementById('photo-preview').src = e.target.result;
                    document.getElementById('photo-preview').classList.remove('hidden');
                    document.getElementById('photo-placeholder').classList.add('hidden');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        // Final Submission after adding photo/aadhaar
        async function generateIDCardAndSave() {
            const aadhaar = document.getElementById('aadhaarInput').value;
            if (!state.examUser.photo || !aadhaar) {
                alert("Please upload photo and enter Aadhaar number.");
                return;
            }
            
            state.loading = true;
            state.examUser.aadhaar = aadhaar;
            render(); // Show loader

            // Generate Training ID: FI-YYYY-RANDOM
            const trainingId = `FI-${new Date().getFullYear()}-${Math.floor(1000 + Math.random() * 9000)}`;
            state.examUser.trainingId = trainingId;

            const total = state.examQuestions.length;
            const percentage = Math.round((state.examScore / total) * 100);

            // Add current user to local ticker immediately
            state.candidates.push({name: state.examUser.name, score: percentage + "%"});
            updateTicker();

            // Save to Sheet
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        name: state.examUser.name,
                        mobile: state.examUser.mobile,
                        aadhaar: aadhaar,
                        trainingId: trainingId,
                        percentage: percentage,
                        status: "PASS"
                    })
                });
            } catch (e) { console.error("Save failed", e); }

            state.loading = false;
            navigate('exam-id-card');
        }

        async function saveFailedResult(percentage) {
            state.loading = true;
            render();
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        name: state.examUser.name,
                        mobile: state.examUser.mobile,
                        aadhaar: "N/A",
                        trainingId: "N/A",
                        percentage: percentage,
                        status: "FAIL"
                    })
                });
            } catch (e) { console.error("Save failed", e); }
            state.loading = false;
            navigate('exam-fail');
        }

        function downloadIDCard() {
            const card = document.getElementById('id-card-node');
            html2canvas(card, { scale: 3, useCORS: true }).then(canvas => {
                const a = document.createElement('a');
                a.download = `Training-ID-${state.examUser.name}.png`;
                a.href = canvas.toDataURL("image/png");
                a.click();
            });
        }

        // --- NAVIGATION & UI ---
        function navigate(viewName) {
            state.view = viewName;
            state.sidebarOpen = false;
            document.getElementById('sidebar-overlay').classList.add('hidden');
            render();
        }

        function toggleSidebar() {
            state.sidebarOpen = !state.sidebarOpen;
            const overlay = document.getElementById('sidebar-overlay');
            state.sidebarOpen ? overlay.classList.remove('hidden') : overlay.classList.add('hidden');
            lucide.createIcons();
        }

        // --- RENDER ---
        function render() {
            const container = document.getElementById('app-content');
            
            if (state.loading) {
                container.innerHTML = `<div class="flex flex-col items-center justify-center min-h-[60vh]"><div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-200 h-12 w-12 mb-4"></div><p class="text-slate-500">Processing...</p></div>`;
                return;
            }

            let html = '';

            // HOME
            if (state.view === 'home') {
                html = `
                    <main class="p-4 max-w-md mx-auto space-y-6 pt-6 fade-in pb-20">
                        <section class="text-center space-y-2">
                            <h2 class="text-3xl font-black text-slate-800">नमस्ते, स्कैफोल्डर!</h2>
                            <p class="text-slate-500">सुरक्षित कार्य ही हमारी प्राथमिकता है।</p>
                            ${state.dataLoaded ? '<span class="text-green-600 text-xs font-bold flex justify-center items-center gap-1"><i data-lucide="check-circle" style="width:12px"></i> ऑनलाइन</span>' : ''}
                        </section>
                        <div class="grid grid-cols-1 gap-4">
                            <button onclick="navigate('study')" class="group bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:border-yellow-500 transition-all flex items-center gap-5 text-left">
                                <div class="bg-blue-100 text-blue-600 p-4 rounded-xl"><i data-lucide="book-open" style="width:32px;height:32px;"></i></div>
                                <div><h3 class="font-bold text-xl text-slate-800">ट्रेनिंग मोड</h3><p class="text-xs text-slate-400">Study Materials</p></div>
                            </button>
                            <button onclick="navigate('equipment')" class="group bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:border-yellow-500 transition-all flex items-center gap-5 text-left">
                                <div class="bg-orange-100 text-orange-600 p-4 rounded-xl"><i data-lucide="hammer" style="width:32px;height:32px;"></i></div>
                                <div><h3 class="font-bold text-xl text-slate-800">टूल्स गैलरी</h3><p class="text-xs text-slate-400">Equipment Guide</p></div>
                            </button>
                            <button onclick="startQuiz()" class="group bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:border-yellow-500 transition-all flex items-center gap-5 text-left">
                                <div class="bg-yellow-100 text-yellow-600 p-4 rounded-xl"><i data-lucide="trophy" style="width:32px;height:32px;"></i></div>
                                <div><h3 class="font-bold text-xl text-slate-800">क्विज चैलेंज</h3><p class="text-xs text-slate-400">Practice Test</p></div>
                            </button>
                            <!-- EXAM CARD -->
                            <button onclick="startExamRegistration()" class="group bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700 hover:bg-slate-900 transition-all flex items-center gap-5 text-left relative overflow-hidden">
                                <div class="absolute right-0 top-0 w-24 h-24 bg-white/5 rounded-bl-full -mr-4 -mt-4"></div>
                                <div class="bg-indigo-500 text-white p-4 rounded-xl relative z-10"><i data-lucide="graduation-cap" style="width:32px;height:32px;"></i></div>
                                <div class="relative z-10 text-white">
                                    <h3 class="font-bold text-xl">फाइनल परीक्षा</h3>
                                    <p class="text-xs text-slate-300">Exam & ID Card</p>
                                </div>
                            </button>
                        </div>
                    </main>`;
            }

            // EXAM REGISTER
            else if (state.view === 'exam-register') {
                html = `
                    <main class="p-6 max-w-md mx-auto min-h-[80vh] flex flex-col justify-center fade-in">
                        <div class="bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
                            <div class="text-center mb-8">
                                <div class="bg-indigo-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-indigo-600">
                                    <i data-lucide="user-plus" style="width:32px;height:32px;"></i>
                                </div>
                                <h2 class="text-2xl font-black text-slate-800">पंजीकरण (Registration)</h2>
                                <p class="text-sm text-slate-500">परीक्षा शुरू करने के लिए अपना विवरण दें</p>
                            </div>
                            
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1 ml-1">आपका नाम (Full Name)</label>
                                    <input type="text" id="regName" class="w-full p-4 rounded-xl bg-slate-50 border border-slate-200 focus:border-indigo-500 focus:outline-none font-bold text-slate-800" placeholder="Ex: Rahul Kumar">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1 ml-1">मोबाइल नंबर (Mobile)</label>
                                    <input type="tel" id="regMobile" class="w-full p-4 rounded-xl bg-slate-50 border border-slate-200 focus:border-indigo-500 focus:outline-none font-bold text-slate-800" placeholder="Ex: 9876543210">
                                </div>
                                <button onclick="handleRegistration()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-indigo-700 transition-colors mt-4 flex items-center justify-center gap-2">
                                    <span>परीक्षा शुरू करें</span>
                                    <i data-lucide="arrow-right" style="width:18px"></i>
                                </button>
                                <button onclick="navigate('home')" class="w-full text-slate-400 text-sm font-medium py-2">रद्द करें (Cancel)</button>
                            </div>
                        </div>
                    </main>
                `;
            }

            // EXAM ACTIVE
            else if (state.view === 'exam-active') {
                const q = state.examQuestions[state.examCurrentIdx];
                const progress = ((state.examCurrentIdx + 1) / state.examQuestions.length) * 100;
                
                html = `
                    <main class="p-4 max-w-md mx-auto pt-6 fade-in pb-20">
                        <div class="flex items-center justify-between mb-4">
                            <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">Question ${state.examCurrentIdx + 1}/${state.examQuestions.length}</span>
                            <span class="text-xs font-bold text-slate-400">Final Exam</span>
                        </div>
                        <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden mb-6">
                            <div class="bg-indigo-600 h-full transition-all duration-300" style="width: ${progress}%"></div>
                        </div>

                        <div class="bg-white rounded-2xl shadow-lg border border-slate-100 p-6 min-h-[400px] flex flex-col">
                            ${q.type === 'image' 
                                ? `<div class="h-48 bg-slate-50 rounded-xl mb-4 flex items-center justify-center border border-slate-100 overflow-hidden"><img src="${processImageUrl(q.image)}" class="h-full object-contain" onerror="this.style.display='none'"></div>` 
                                : ''
                            }
                            
                            <h3 class="text-lg font-bold text-slate-800 mb-6 leading-relaxed">${q.question}</h3>
                            
                            <div class="space-y-3 mt-auto">
                                ${q.options.map(opt => `
                                    <button onclick="submitExamAnswer('${opt.replace(/'/g, "\\'")}')" class="w-full text-left p-4 rounded-xl border-2 border-slate-100 hover:border-indigo-500 hover:bg-indigo-50 transition-all font-medium text-slate-700 text-sm">
                                        ${opt}
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    </main>
                `;

        }

        // ... Payment Modal Logic ...
        function openPaymentModal() { if (state.sidebarOpen) { state.sidebarOpen = false; document.getElementById('sidebar-overlay').classList.add('hidden'); } const modal = document.getElementById('payment-modal'); const upiLink = `upi://pay?pa=${UPI_ID}&pn=${encodeURIComponent(PAYEE_NAME)}&cu=INR`; const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(upiLink)}`; downloadImage(qrUrl, "payment-qr.png"); modal.innerHTML = `<div class="bg-white w-full max-w-[320px] rounded-3xl overflow-hidden shadow-2xl relative content-enter transform scale-100 transition-transform" onclick="event.stopPropagation()"><div class="bg-yellow-400 p-5 text-center relative"><h3 class="text-base font-black text-slate-900 uppercase tracking-wider leading-tight">Support Us To Keep Things Free</h3><button onclick="closePaymentModal()" class="absolute top-3 right-3 text-slate-900/50 hover:text-slate-900 transition-colors"><i data-lucide="x" style="width:20px;height:20px;"></i></button></div><div id="printable-card" class="bg-white"><div class="p-6 flex flex-col items-center gap-5"><div class="p-2 rounded-2xl border-2 border-dashed border-slate-200 bg-slate-50"><img src="${qrUrl}" alt="Scan QR" class="w-48 h-48 object-contain mix-blend-multiply" crossorigin="anonymous"></div><div class="w-full"><button id="copyBtn" onclick="copyUpi()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 flex items-center justify-between group active:bg-yellow-50 transition-colors"><div class="flex flex-col items-start"><span class="text-[10px] text-slate-400 font-bold uppercase">UPI ID</span><span class="text-xs font-mono font-bold text-slate-800">${UPI_ID}</span></div><div class="bg-white p-2 rounded-lg shadow-sm text-slate-400 group-hover:text-yellow-600 transition-colors"><i data-lucide="copy" style="width:16px;height:16px;"></i></div></button><p class="text-[10px] text-slate-400 text-center mt-2">QR Code has been downloaded to your gallery.</p></div></div><div class="bg-slate-50 p-3 text-center border-t border-slate-100"><p class="text-[10px] text-slate-500 font-bold tracking-wide">Made With <span class="text-red-500">❤️</span> By Happy Solutions</p></div></div></div>`; modal.classList.remove('hidden'); lucide.createIcons(); const qrImg = modal.querySelector('img'); if (qrImg) { if (qrImg.complete) { captureAndDownload(); } else { qrImg.onload = captureAndDownload; } } }
        function captureAndDownload() { const element = document.getElementById('printable-card'); if (!element) return; html2canvas(element, { useCORS: true, scale: 2, backgroundColor: null }).then(canvas => { const link = document.createElement('a'); link.download = 'Happy-Solutions-Support.png'; link.href = canvas.toDataURL("image/png"); link.click(); }).catch(err => { console.error("Card download failed:", err); }); }
        function closePaymentModal() { document.getElementById('payment-modal').classList.add('hidden'); }
        async function downloadImage(imageSrc, nameOfDownload) { try { const response = await fetch(imageSrc); const blob = await response.blob(); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = nameOfDownload; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); } catch (error) { console.log('Auto-download prevented by browser', error); } }
        function copyUpi() { navigator.clipboard.writeText(UPI_ID).then(() => { const btn = document.getElementById('copyBtn'); const originalContent = btn.innerHTML; btn.classList.add('bg-green-50', 'border-green-200'); btn.innerHTML = `<div class="flex items-center gap-2 w-full justify-center text-green-700 py-1"><i data-lucide="check-circle" style="width:16px;height:16px;"></i><span class="text-sm font-bold">Copied!</span></div>`; lucide.createIcons(); setTimeout(() => { btn.innerHTML = originalContent; btn.classList.remove('bg-green-50', 'border-green-200'); lucide.createIcons(); }, 2000); }).catch(err => console.error('Failed to copy', err)); }

        // Initialize
        fetchSheetData();
        render();
    </script>
</body>
</html>
