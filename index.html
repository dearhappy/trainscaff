<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile App Hub</title>
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
            /* Professional Mesh Gradient */
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        
        .ios-scroll { -webkit-overflow-scrolling: touch; }
        
        /* Glassmorphism Effect */
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .loader {
            border-top-color: #fbbf24;
            animation: spinner 1s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Staggered Fade In */
        .app-card-entry {
            animation: fadeInUp 0.5s ease-out forwards;
            opacity: 0;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Ticker Animation */
        .ticker-container {
            overflow: hidden;
            white-space: nowrap;
        }
        .ticker-content {
            display: inline-block;
            padding-left: 100%;
            animation: ticker 30s linear infinite;
        }
        @keyframes ticker {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        .coffee-float { animation: float 4s ease-in-out infinite; }
        @keyframes float { 
            0%, 100% { transform: translateY(0px); } 
            50% { transform: translateY(-10px); } 
        }

        .search-glow:focus-within {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
            border-color: rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body class="text-white h-screen w-screen overflow-hidden">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- CONFIGURATION ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwX-IYZ0Kwwg6abtD--dfHslPEfNnlLvWkYJZRNOjHg65xndMaINSiq-8gumgheK9SPoA/exec"; 
        const UPI_ID = "dearhappy@sbi";

        const Ticker = ({ supporters }) => {
            if (!supporters || supporters.length === 0) return null;
            
            return (
                <div className="bg-black/40 backdrop-blur-md border-b border-white/10 py-2 ticker-container">
                    <div className="ticker-content">
                        {supporters.map((s, i) => (
                            <span key={i} className="mx-12 text-[11px] font-bold text-yellow-400 uppercase tracking-widest">
                                TOP SUPPORTER: <span className="text-white ml-1">{s.name}</span> <span className="text-emerald-400 ml-2">₹{s.amount}</span>
                            </span>
                        ))}
                        {/* Repeat for seamless loop */}
                        {supporters.map((s, i) => (
                            <span key={`dup-${i}`} className="mx-12 text-[11px] font-bold text-yellow-400 uppercase tracking-widest">
                                TOP SUPPORTER: <span className="text-white ml-1">{s.name}</span> <span className="text-emerald-400 ml-2">₹{s.amount}</span>
                            </span>
                        ))}
                    </div>
                </div>
            );
        };

        const Header = ({ onSearch, searchTerm }) => (
            <div className="px-6 py-6 sticky top-0 z-20">
                <div className="max-w-md mx-auto relative group search-glow bg-white/5 rounded-2xl border border-white/10 transition-all duration-300">
                    <i className="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-white/30 group-focus-within:text-blue-400 transition-colors"></i>
                    <input 
                        type="text" 
                        placeholder="Search your applications..." 
                        value={searchTerm}
                        onChange={(e) => onSearch(e.target.value)}
                        className="w-full bg-transparent border-none rounded-2xl pl-12 pr-4 py-4 text-sm focus:ring-0 outline-none placeholder:text-white/20 text-white"
                    />
                </div>
            </div>
        );

        const AppCard = ({ name, url, index }) => {
            const handleClick = () => {
                if (url) window.location.href = url;
            };

            return (
                <button 
                    onClick={handleClick} 
                    style={{ animationDelay: `${index * 0.05}s` }}
                    className="app-card-entry glass group relative p-8 rounded-[2rem] active:scale-95 hover:bg-white/10 hover:border-white/30 transition-all duration-300 flex flex-col items-center justify-center min-h-[140px] w-full"
                >
                    {/* Decorative Corner Accent */}
                    <div className="absolute top-4 right-4 w-2 h-2 rounded-full bg-white/20 group-hover:bg-blue-400 transition-colors"></div>
                    
                    <span className="text-lg font-extrabold text-white text-center leading-tight tracking-tight group-hover:scale-105 transition-transform">
                        {name}
                    </span>
                    
                    <div className="mt-4 opacity-0 group-hover:opacity-100 transition-opacity flex items-center text-[10px] font-bold text-blue-400 tracking-tighter uppercase">
                        Launch Application <i className="fa-solid fa-chevron-right ml-2"></i>
                    </div>
                </button>
            );
        };

        const CoffeeButton = () => {
            const openSupport = () => {
                const tr = Math.floor(Math.random() * 1000000000);
                const upiLink = `upi://pay?pa=${UPI_ID}&pn=Support&mc=0000&mode=00&tn=CoffeeSupport&tr=${tr}&cu=INR`;
                window.location.href = upiLink;
            };

            return (
                <div className="fixed bottom-8 right-8 z-50 flex flex-col items-center cursor-pointer group" onClick={openSupport}>
                    <div className="mb-3 coffee-float">
                        <div className="bg-yellow-400 text-slate-900 text-[10px] font-black px-4 py-2 rounded-xl shadow-xl whitespace-nowrap relative border border-yellow-500 tracking-tighter">
                            BUY ME A COFFEE
                            <div className="absolute -bottom-1 left-1/2 -translate-x-1/2 w-2 h-2 bg-yellow-400 rotate-45 border-b border-r border-yellow-500"></div>
                        </div>
                    </div>
                    <div className="bg-white text-slate-900 p-5 rounded-3xl shadow-[0_0_30px_rgba(255,255,255,0.2)] border-2 border-transparent hover:border-yellow-400 hover:scale-110 transition-all duration-300">
                        <i className="fa-solid fa-mug-hot text-xl"></i>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [apps, setApps] = useState([]);
            const [supporters, setSupporters] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [searchTerm, setSearchTerm] = useState("");

            useEffect(() => {
                const fetchData = async () => {
                    try {
                        const response = await fetch(SCRIPT_URL);
                        const data = await response.json();
                        
                        if (Array.isArray(data)) {
                            setApps(data);
                            const sups = data
                                .filter(item => item.supporter && item.amount)
                                .map(item => ({ name: item.supporter, amount: item.amount }));
                            setSupporters(sups);
                        } else if (data.apps) {
                            setApps(data.apps);
                            setSupporters(data.supporters || []);
                        }
                    } catch (err) {
                        console.error("Fetch error:", err);
                        setError("Secure Connection Failed");
                    } finally {
                        setLoading(false);
                    }
                };
                fetchData();
            }, []);

            const filteredApps = useMemo(() => {
                return apps.filter(app => 
                    app.name.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }, [apps, searchTerm]);

            return (
                <div className="h-full flex flex-col max-w-lg mx-auto overflow-hidden relative border-x border-white/5">
                    <Ticker supporters={supporters} />
                    <Header searchTerm={searchTerm} onSearch={setSearchTerm} />
                    
                    <main className="flex-1 overflow-y-auto ios-scroll px-6 pb-32">
                        {loading ? (
                            <div className="flex flex-col items-center justify-center h-64 text-white/30">
                                <div className="loader ease-linear rounded-full border-2 border-white/10 h-12 w-12 mb-6"></div>
                                <p className="text-sm font-bold tracking-widest uppercase">Initializing Hub</p>
                            </div>
                        ) : error ? (
                            <div className="text-center p-12 glass rounded-[2.5rem] mt-10">
                                <i className="fa-solid fa-circle-nodes text-4xl text-blue-500 mb-6 block"></i>
                                <h3 className="text-white font-black text-xl mb-2 tracking-tight">Access Error</h3>
                                <p className="text-white/40 text-xs">{error}</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 gap-5">
                                {filteredApps.map((app, index) => (
                                    <AppCard 
                                        key={index} 
                                        index={index}
                                        name={app.name} 
                                        url={app.url} 
                                    />
                                ))}
                                {filteredApps.length === 0 && (
                                    <div className="text-center py-20 text-white/20">
                                        <p className="text-sm italic">No matching apps found</p>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    <CoffeeButton />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
