<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScaffoldMaster - By Gurwinder Singh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .loader { border-top-color: #EAB308; -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-10">

    <!-- Header -->
    <header class="bg-slate-900 text-white p-4 sticky top-0 z-50 flex items-center justify-between shadow-md">
        <div class="flex items-center gap-2 cursor-pointer" onclick="navigate('home')">
            <div class="bg-yellow-500 p-1.5 rounded-lg text-slate-900">
                <i data-lucide="shield-check"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight">ScaffoldMaster</h1>
                <p class="text-[10px] uppercase tracking-widest text-yellow-500 font-semibold text-left">By Gurwinder Singh</p>
            </div>
        </div>
        <button onclick="toggleSidebar()" class="p-2 hover:bg-slate-800 rounded-full">
            <i data-lucide="menu" id="menu-icon"></i>
        </button>
    </header>

    <!-- Sidebar -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 backdrop-blur-sm hidden" onclick="toggleSidebar()">
        <div class="absolute right-0 top-0 bottom-0 w-64 bg-white p-6 shadow-2xl transition-transform" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="info" class="text-yellow-600"></i> मेनू
                </h2>
                <button onclick="toggleSidebar()" class="text-slate-400"><i data-lucide="x"></i></button>
            </div>
            <nav class="space-y-4">
                <button onclick="navigate('home')" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-slate-100 text-left font-medium transition-colors">
                    <i data-lucide="home"></i> मुख्य पृष्ठ
                </button>
                <button onclick="navigate('study')" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-slate-100 text-left font-medium transition-colors">
                    <i data-lucide="book-open"></i> ट्रेनिंग सामग्री
                </button>
                <button onclick="navigate('equipment')" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-slate-100 text-left font-medium transition-colors">
                    <i data-lucide="hammer"></i> टूल्स और उपकरण
                </button>
                <button onclick="startQuiz()" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-slate-100 text-left font-medium transition-colors">
                    <i data-lucide="trophy"></i> नॉलेज टेस्ट (Quiz)
                </button>
                <div class="pt-4 mt-4 border-t border-slate-100">
                    <button onclick="openSupport()" class="w-full flex items-center gap-3 p-3 rounded-lg bg-yellow-50 text-yellow-700 hover:bg-yellow-100 text-left font-bold transition-colors">
                        <i data-lucide="coffee"></i> Buy Me a Coffee
                    </button>
                </div>
            </nav>
            <div class="absolute bottom-10 left-6 right-6 p-4 bg-yellow-50 rounded-xl border border-yellow-100 text-xs text-yellow-800">
                <p class="font-bold mb-1">सुरक्षा पहले!</p>
                हमेशा PPE का उपयोग करें और टैग की जांच करें।
            </div>
        </div>
    </div>

    <!-- Container for Views -->
    <div id="app-content">
        <!-- Views will be injected here -->
    </div>

    <!-- Item Detail Modal Overlay -->
    <div id="item-modal" class="fixed inset-0 bg-black/80 z-[60] hidden flex items-center justify-center p-4 backdrop-blur-sm" onclick="closeItem()">
        <!-- Content injected via JS -->
    </div>

    <!-- Support/Payment Modal Overlay (Content generated dynamically in openSupport) -->
    <div id="support-modal" class="fixed inset-0 bg-black/80 z-[70] hidden flex items-center justify-center p-4 backdrop-blur-sm" onclick="closeSupport()">
        <!-- Content injected via JS -->
    </div>

    <script>
        // ---------------------------------------------------------
        // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
        // ---------------------------------------------------------
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz4FLd0mdJRn_4penuuIZdpReRSZLclucTt5WfGZGsCslZDvag3fX8w62AvlbBYASGb/exec"; 
        // ---------------------------------------------------------

        // ---------------------------------------------------------
        // YOUR UPI DETAILS
        // ---------------------------------------------------------
        const UPI_ID = "gurwinders774@fifederal"; // आपकी UPI ID
        const PAYEE_NAME = "Thanks"; // आपका नाम
        // ---------------------------------------------------------

        // Fallback data
        const fallbackData = [
            { id: 1, q: "स्कैफोल्डिंग क्या है?", a: "स्कैफोल्डिंग एक अस्थायी संरचना है जो ऊँचाई पर काम करने के लिए बनाई जाती है।", cat: "Basics" },
            { id: 2, q: "स्टैंडर्ड क्या है?", a: "यह खड़ा पाइप होता है जो जमीन से ऊपर तक भार उठाता है।", cat: "Components" },
            { id: 3, q: "गार्डरेल क्यों जरूरी है?", a: "यह ऊपरी सुरक्षा रेल है जो व्यक्ति को गिरने से बचाती है।", cat: "Safety" }
        ];

        let state = {
            view: 'home',
            currentIdx: 0,
            score: 0,
            showAnswer: false,
            questions: fallbackData,
            equipment: [],
            filter: 'All',
            sidebarOpen: false,
            loading: false,
            dataLoaded: false,
            selectedItem: null // For equipment modal
        };

        // --- Image Processor for Drive Links ---
        function processImageUrl(url) {
            if (!url) return null;
            if (url.includes('drive.google.com') || url.includes('docs.google.com')) {
                const idMatch = url.match(/\/d\/([^/]+)/);
                if (idMatch && idMatch[1]) {
                    return `https://lh3.googleusercontent.com/d/${idMatch[1]}`;
                }
            }
            return url;
        }

        // --- Data Fetching Logic ---
        async function fetchSheetData() {
            if (!SCRIPT_URL) return;

            state.loading = true;
            render(); 

            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                
                if (data.questions && data.questions.length > 0) {
                    state.questions = data.questions;
                }
                if (data.equipment && data.equipment.length > 0) {
                    state.equipment = data.equipment;
                }
                state.dataLoaded = true;
            } catch (error) {
                console.error("Data fetch error");
            } finally {
                state.loading = false;
                render();
            }
        }

        // --- Navigation Logic ---
        function toggleSidebar() {
            state.sidebarOpen = !state.sidebarOpen;
            const overlay = document.getElementById('sidebar-overlay');
            if (state.sidebarOpen) {
                overlay.classList.remove('hidden');
            } else {
                overlay.classList.add('hidden');
            }
            lucide.createIcons();
        }

        function navigate(viewName) {
            state.view = viewName;
            state.sidebarOpen = false;
            document.getElementById('sidebar-overlay').classList.add('hidden');
            render();
        }

        function setFilter(cat) {
            state.filter = cat;
            render();
        }

        function startQuiz() {
            const shuffled = [...state.questions].sort(() => 0.5 - Math.random()).slice(0, 10);
            state.userSelections = shuffled;
            state.currentIdx = 0;
            state.score = 0;
            state.view = 'quiz';
            state.showAnswer = false;
            state.sidebarOpen = false;
            document.getElementById('sidebar-overlay').classList.add('hidden');
            render();
        }

        function handleQuizAnswer(isCorrect) {
            if (isCorrect) state.score++;
            if (state.currentIdx + 1 < state.userSelections.length) {
                state.currentIdx++;
                state.showAnswer = false;
            } else {
                state.view = 'results';
            }
            render();
        }

        // --- Equipment Modal Logic ---
        function viewItem(id) {
            const item = state.equipment.find(e => e.id == id);
            if (item) {
                state.selectedItem = item;
                renderModal();
            }
        }

        function closeItem() {
            state.selectedItem = null;
            document.getElementById('item-modal').classList.add('hidden');
        }

        function renderModal() {
            const modal = document.getElementById('item-modal');
            const item = state.selectedItem;
            
            if (!item) return;

            const imgUrl = processImageUrl(item.image);

            modal.innerHTML = `
                <div class="bg-white w-full max-w-lg rounded-2xl overflow-hidden shadow-2xl relative animate-in zoom-in duration-200" onclick="event.stopPropagation()">
                    <button onclick="closeItem()" class="absolute top-3 right-3 bg-black/50 text-white p-2 rounded-full hover:bg-black/70 z-10 backdrop-blur-md">
                        <i data-lucide="x"></i>
                    </button>
                    <div class="h-64 bg-slate-100 w-full relative">
                        ${imgUrl ? `<img src="${imgUrl}" alt="${item.name}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/600x400?text=No+Image'"/>` : `<div class="w-full h-full flex items-center justify-center text-slate-400"><i data-lucide="image" style="width:48px;height:48px;"></i></div>`}
                    </div>
                    <div class="p-6">
                        <div class="flex items-center gap-2 mb-4">
                            <span class="bg-yellow-100 text-yellow-800 text-xs font-bold px-2 py-1 rounded uppercase tracking-wider">Equipment #${item.id}</span>
                        </div>
                        <h3 class="text-2xl font-bold text-slate-800 mb-3">${item.name}</h3>
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 text-slate-600 leading-relaxed text-sm">
                            ${item.detail || "विवरण उपलब्ध नहीं है।"}
                        </div>
                        <button onclick="closeItem()" class="w-full mt-6 bg-slate-900 text-white py-3 rounded-xl font-bold hover:bg-slate-800 transition-colors">
                            बंद करें
                        </button>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
            lucide.createIcons();
        }

        // --- Support Modal Logic (UPDATED) ---
        function openSupport() {
            const modal = document.getElementById('support-modal');
            
            // Generate UPI Link
            const upiLink = `upi://pay?pa=${UPI_ID}&pn=${encodeURIComponent(PAYEE_NAME)}&cu=INR`;
            // Generate QR using API based on UPI Link
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(upiLink)}`;

            modal.innerHTML = `
                <div class="bg-white w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl relative animate-in zoom-in duration-200 text-center p-6" onclick="event.stopPropagation()">
                    <button onclick="closeSupport()" class="absolute top-3 right-3 text-slate-400 hover:text-slate-800">
                        <i data-lucide="x"></i>
                    </button>
                    
                    <div class="w-16 h-16 bg-yellow-100 text-yellow-600 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i data-lucide="coffee" style="width:32px;height:32px;"></i>
                    </div>
                    
                    <h3 class="text-2xl font-black text-slate-800 mb-2">Buy Me a Coffee</h3>
                    <p class="text-slate-500 text-sm mb-4">अगर आपको यह ऐप पसंद आया, तो आप मुझे सपोर्ट कर सकते हैं।</p>
                    
                    <!-- Direct UPI Button -->
                    <a href="${upiLink}" class="w-full mb-6 bg-slate-900 text-white py-3 rounded-xl font-bold shadow-lg hover:bg-slate-800 transition-colors flex items-center justify-center gap-2">
                        <span>Pay via UPI App</span>
                        <i data-lucide="arrow-right" style="width:18px;height:18px;"></i>
                    </a>

                    <!-- QR CODE SECTION -->
                    <div class="relative mb-4">
                        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div>
                        <div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-2 text-slate-400">OR SCAN QR</span></div>
                    </div>

                    <div class="bg-white p-4 rounded-xl border-2 border-slate-100 mb-4 inline-block shadow-sm">
                        <img src="${qrUrl}" 
                             alt="Payment QR Code" 
                             class="w-32 h-32 object-contain mx-auto mix-blend-multiply">
                    </div>

                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-100 mb-2">
                        <p class="text-xs text-slate-400 uppercase font-bold tracking-wider mb-1">UPI ID</p>
                        <div class="flex items-center justify-center gap-2">
                            <code class="text-slate-800 font-mono font-bold select-all">${UPI_ID}</code>
                            <button onclick="navigator.clipboard.writeText('${UPI_ID}')" class="text-blue-600 hover:text-blue-800">
                                <i data-lucide="copy" style="width:16px;height:16px;"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;

            modal.classList.remove('hidden');
            state.sidebarOpen = false;
            document.getElementById('sidebar-overlay').classList.add('hidden');
            lucide.createIcons();
        }

        function closeSupport() {
            document.getElementById('support-modal').classList.add('hidden');
        }

        // --- Render Logic ---
        function render() {
            const container = document.getElementById('app-content');
            let html = '';

            // Loading Screen (Generic)
            if (state.loading) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center min-h-[60vh]">
                        <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-200 h-12 w-12 mb-4"></div>
                        <h2 class="text-xl font-bold text-slate-600">कंटेंट लोड हो रहा है...</h2>
                        <p class="text-sm text-slate-400">कृपया प्रतीक्षा करें</p>
                    </div>
                `;
                return;
            }

            // Home View
            if (state.view === 'home') {
                const statusMessage = state.dataLoaded 
                    ? '<span class="text-green-600 text-xs font-bold flex items-center gap-1 bg-green-100 px-2 py-1 rounded-full"><i data-lucide="check-circle" style="width:12px; height:12px;"></i> अपडेटेड</span>' 
                    : '';

                html = `
                    <main class="p-4 max-w-md mx-auto space-y-6 pt-6 fade-in pb-20">
                        <section class="text-center space-y-2">
                            <h2 class="text-3xl font-black text-slate-800">नमस्ते, स्कैफोल्डर!</h2>
                            <p class="text-slate-500">सुरक्षित कार्य ही हमारी प्राथमिकता है।</p>
                            <div class="flex justify-center mt-2 h-6">${statusMessage}</div>
                        </section>
                        <div class="grid grid-cols-1 gap-4">
                            <button onclick="navigate('study')" class="group bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:border-yellow-500 hover:shadow-md transition-all flex items-center gap-5 text-left relative overflow-hidden">
                                <div class="absolute right-0 top-0 w-24 h-24 bg-blue-50 rounded-bl-full -mr-4 -mt-4 transition-transform group-hover:scale-110"></div>
                                <div class="bg-blue-100 text-blue-600 p-4 rounded-xl z-10"><i data-lucide="book-open" style="width:32px;height:32px;"></i></div>
                                <div class="z-10">
                                    <h3 class="font-bold text-xl text-slate-800">ट्रेनिंग मोड</h3>
                                </div>
                            </button>
                            <button onclick="navigate('equipment')" class="group bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:border-yellow-500 hover:shadow-md transition-all flex items-center gap-5 text-left relative overflow-hidden">
                                <div class="absolute right-0 top-0 w-24 h-24 bg-orange-50 rounded-bl-full -mr-4 -mt-4 transition-transform group-hover:scale-110"></div>
                                <div class="bg-orange-100 text-orange-600 p-4 rounded-xl z-10"><i data-lucide="hammer" style="width:32px;height:32px;"></i></div>
                                <div class="z-10">
                                    <h3 class="font-bold text-xl text-slate-800">टूल्स गैलरी</h3>
                                </div>
                            </button>
                            <button onclick="startQuiz()" class="group bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:border-yellow-500 hover:shadow-md transition-all flex items-center gap-5 text-left relative overflow-hidden">
                                <div class="absolute right-0 top-0 w-24 h-24 bg-yellow-50 rounded-bl-full -mr-4 -mt-4 transition-transform group-hover:scale-110"></div>
                                <div class="bg-yellow-100 text-yellow-600 p-4 rounded-xl z-10"><i data-lucide="trophy" style="width:32px;height:32px;"></i></div>
                                <div class="z-10">
                                    <h3 class="font-bold text-xl text-slate-800">क्विज चैलेंज</h3>
                                </div>
                            </button>
                        </div>

                        <!-- Support Button in Main View -->
                        <button onclick="openSupport()" class="w-full mt-4 bg-slate-900 text-white p-4 rounded-2xl shadow-lg flex items-center justify-center gap-3 hover:bg-slate-800 transition-colors">
                            <i data-lucide="coffee"></i>
                            <span class="font-bold">Buy Me a Coffee</span>
                        </button>
                    </main>
                `;
            } 
            
            // Equipment View (Grid + Modal)
            else if (state.view === 'equipment') {
                const hasEquip = state.equipment.length > 0;
                html = `
                    <main class="p-4 max-w-2xl mx-auto space-y-4 fade-in">
                        <div class="flex justify-between items-center mb-4">
                            <div>
                                <h2 class="text-2xl font-black text-slate-800">उपकरण गैलरी</h2>
                                <p class="text-xs text-slate-500 font-bold uppercase tracking-widest">विवरण के लिए क्लिक करें</p>
                            </div>
                            <button onclick="navigate('home')" class="bg-slate-100 p-2 rounded-full hover:bg-slate-200"><i data-lucide="x"></i></button>
                        </div>
                        
                        ${!hasEquip ? `
                            <div class="text-center p-10 bg-white rounded-2xl border border-dashed border-slate-300">
                                <i data-lucide="image-off" class="mx-auto text-slate-300 mb-3 w-12 h-12"></i>
                                <p class="text-slate-500 font-medium">कोई डेटा उपलब्ध नहीं है</p>
                            </div>
                        ` : `
                            <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                                ${state.equipment.map(item => {
                                    // USE processImageUrl HERE
                                    const imgUrl = processImageUrl(item.image);
                                    return `
                                    <div onclick="viewItem('${item.id}')" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden cursor-pointer hover:shadow-lg hover:border-yellow-400 transition-all transform hover:-translate-y-1 active:scale-95 group">
                                        <div class="aspect-square bg-slate-100 w-full relative overflow-hidden">
                                            ${imgUrl ? `<img src="${imgUrl}" alt="${item.name}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" onerror="this.src='https://placehold.co/300x300?text=Image'"/>` : `<div class="w-full h-full flex items-center justify-center text-slate-300"><i data-lucide="image"></i></div>`}
                                            <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-end justify-center pb-4">
                                                <span class="text-white text-xs font-bold bg-yellow-500 px-2 py-1 rounded">देखें</span>
                                            </div>
                                        </div>
                                        <div class="p-3 text-center">
                                            <h3 class="font-bold text-sm text-slate-800 line-clamp-2 leading-tight">${item.name}</h3>
                                        </div>
                                    </div>
                                `}).join('')}
                            </div>
                        `}
                        <button onclick="navigate('home')" class="w-full py-4 mt-6 bg-slate-200 text-slate-700 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-slate-300">
                            <i data-lucide="chevron-left"></i> वापस
                        </button>
                    </main>
                `;
            }

            // Study View
            else if (state.view === 'study') {
                const categories = ['All', ...new Set(state.questions.map(q => q.cat))];
                const filtered = state.filter === 'All' ? state.questions : state.questions.filter(q => q.cat === state.filter);
                
                html = `
                    <main class="p-4 max-w-xl mx-auto space-y-6 fade-in">
                        <div class="sticky top-[72px] z-30 bg-slate-50/95 backdrop-blur py-2">
                            <div class="flex items-center gap-3 overflow-x-auto pb-2 scrollbar-hide">
                                ${categories.map(cat => `
                                    <button onclick="setFilter('${cat}')" class="px-5 py-2 rounded-full text-sm font-bold whitespace-nowrap transition-all shadow-sm ${state.filter === cat ? 'bg-slate-800 text-white shadow-md transform scale-105' : 'bg-white text-slate-600 border border-slate-200'}">
                                        ${cat}
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                        <div class="space-y-4 pb-8">
                            ${filtered.map(q => `
                                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-yellow-500 hover:shadow-md transition-shadow">
                                    <div class="flex justify-between items-start mb-3">
                                        <span class="text-[10px] bg-slate-100 px-2 py-1 rounded font-bold text-slate-500 uppercase tracking-wide">${q.cat}</span>
                                        <span class="text-xs text-slate-300 font-mono">#${q.id}</span>
                                    </div>
                                    <h3 class="font-bold text-lg mb-3 text-slate-900 leading-snug">${q.q}</h3>
                                    <div class="bg-blue-50/50 p-4 rounded-lg text-slate-700 border border-blue-100/50">
                                        <span class="text-blue-600 font-black mr-1 text-sm uppercase">उत्तर:</span> ${q.a}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        <div class="fixed bottom-6 right-6">
                            <button onclick="navigate('home')" class="bg-slate-900 text-white p-4 rounded-full shadow-2xl flex items-center justify-center hover:bg-slate-800">
                                <i data-lucide="home"></i>
                            </button>
                        </div>
                    </main>
                `;
            } 
            
            // Quiz View
            else if (state.view === 'quiz') {
                const q = state.userSelections[state.currentIdx];
                const progress = ((state.currentIdx + 1) / state.userSelections.length) * 100;

                html = `
                    <main class="p-4 max-w-md mx-auto space-y-6 pt-6 text-center fade-in">
                        <div class="flex items-center justify-between mb-2">
                            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest">प्रश्न ${state.currentIdx + 1} / ${state.userSelections.length}</h2>
                            <div class="bg-yellow-100 px-3 py-1 rounded-full text-yellow-800 font-bold text-xs">स्कोर: ${state.score}</div>
                        </div>
                        <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                            <div class="bg-yellow-500 h-full transition-all duration-300" style="width: ${progress}%"></div>
                        </div>
                        <div class="bg-white rounded-2xl shadow-xl border border-slate-100 p-8 min-h-[350px] flex flex-col items-center justify-center relative">
                            <h3 class="text-2xl font-bold text-slate-800 mb-8 leading-tight">${q.q}</h3>
                            ${!state.showAnswer ? `
                                <button onclick="state.showAnswer=true; render();" class="bg-slate-900 text-white px-10 py-4 rounded-xl font-bold shadow-lg hover:bg-slate-800 hover:shadow-xl transform hover:-translate-y-1 transition-all">उत्तर दिखाएँ</button>
                            ` : `
                                <div class="w-full space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-300">
                                    <div class="bg-blue-50 p-6 rounded-xl border border-blue-100 text-slate-800 text-lg font-medium">${q.a}</div>
                                    <p class="text-sm text-slate-400 font-bold uppercase tracking-wide">क्या आपका जवाब सही था?</p>
                                    <div class="grid grid-cols-2 gap-4">
                                        <button onclick="handleQuizAnswer(false)" class="p-4 rounded-xl border-2 border-slate-100 text-red-500 font-bold flex flex-col items-center hover:bg-red-50 hover:border-red-200 transition-colors"><i data-lucide="x" class="mb-1"></i>गलत</button>
                                        <button onclick="handleQuizAnswer(true)" class="p-4 rounded-xl border-2 border-slate-100 text-green-500 font-bold flex flex-col items-center hover:bg-green-50 hover:border-green-200 transition-colors"><i data-lucide="check-circle-2" class="mb-1"></i>सही</button>
                                    </div>
                                </div>
                            `}
                        </div>
                    </main>
                `;
            } 
            
            // Results View
            else if (state.view === 'results') {
                const percentage = (state.score / 10) * 100;
                let message = percentage >= 80 ? "शानदार प्रदर्शन!" : percentage >= 50 ? "अच्छा प्रयास!" : "और अभ्यास करें";
                let color = percentage >= 80 ? "text-green-500" : percentage >= 50 ? "text-yellow-500" : "text-slate-400";

                html = `
                    <main class="p-4 max-w-md mx-auto flex flex-col items-center justify-center min-h-[70vh] text-center space-y-8 fade-in">
                        <div class="relative">
                            <svg class="w-48 h-48 transform -rotate-90">
                                <circle cx="96" cy="96" r="88" stroke="currentColor" stroke-width="12" fill="transparent" class="text-slate-200" />
                                <circle cx="96" cy="96" r="88" stroke="currentColor" stroke-width="12" fill="transparent" class="${percentage >= 80 ? 'text-green-500' : 'text-yellow-500'}" stroke-dasharray="552" stroke-dashoffset="${552 - (552 * percentage / 100)}" stroke-linecap="round" />
                            </svg>
                            <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
                                <span class="text-5xl font-black text-slate-800">${state.score}</span>
                                <span class="text-xl text-slate-400 font-bold">/10</span>
                            </div>
                        </div>
                        
                        <div>
                            <h2 class="text-3xl font-black text-slate-800 mb-2">${message}</h2>
                            <p class="text-slate-500">आपने क्विज पूरा कर लिया है।</p>
                        </div>

                        <div class="w-full space-y-3">
                            <button onclick="startQuiz()" class="w-full py-4 bg-slate-900 text-white rounded-xl font-bold shadow-lg shadow-slate-300 flex items-center justify-center gap-2 hover:bg-slate-800"><i data-lucide="refresh-cw"></i> फिर से कोशिश करें</button>
                            <button onclick="navigate('home')" class="w-full py-4 bg-white border-2 border-slate-100 text-slate-600 rounded-xl font-bold hover:bg-slate-50">मुख्य पृष्ठ</button>
                        </div>
                    </main>
                `;
            }

            container.innerHTML = html;
            lucide.createIcons();
        }

        // Initialize
        fetchSheetData(); // Fetch real data
        render(); // Render initial state
    </script>
</body>
</html>
